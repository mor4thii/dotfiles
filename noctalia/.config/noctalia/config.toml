[shell]
font_family = "DejaVu Sans"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.animation]
    enabled = false

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Catppuccin"
community_palette = "Occult Umbral"
mode = "dark"
pure_black_dark = true
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4" ]
    community_ids = []
    enable_community_templates = false

[wallpaper]
directory = "/home/fred/Repositories/dotfiles/Wallpapers"

    [wallpaper.default]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"

    [wallpaper.last]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"
