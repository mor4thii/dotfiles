[audio]
enable_sounds = true

[bar.default]
auto_hide = true
reserve_space = false
thickness = 32

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[shell]
font_family = "DejaVu Sans"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Catppuccin"
community_palette = "Occult Umbral"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4" ]
    community_ids = [ "discord" ]

[wallpaper]
directory = "/home/fred/Repositories/dotfiles/Wallpapers"

    [wallpaper.default]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"

    [wallpaper.last]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/fred/Repositories/dotfiles/Wallpapers/catppuccin/cabin-2.jpg"
